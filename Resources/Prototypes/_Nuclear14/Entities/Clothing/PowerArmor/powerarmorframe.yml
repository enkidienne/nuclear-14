# Frames

- type: entity
  id: BasePowerArmorFrame
  abstract: true
  name: "power armor frame"
  components:
  - type: MobMover
  - type: InputMover
  - type: PowerArmorFrame
    entryDelay: 3
    exitDelay: 3
    damageBleedThrough: 0.15
    # One pool: bare chassis at 100, plus whatever is fitted.
    baseIntegrity: 100
    # Bands by fraction remaining, for the examine readout.
    condition:
      goodColor: green
      goodAt: 0.66
      wornColor: yellow
      wornAt: 0.33
      badColor: red
    pilotHeadOffset: 0, 0.1875
  - type: ContainerContainer
    containers:
      power-armor-pilot-slot:
        !type:ContainerSlot
        # Show the occupant, else the container occludes their sprite.
        showEnts: true
      # The frame parks its issued core and harness here between occupants.
      power-armor-issued-gear: !type:Container
  # Excludes non-power-armour items; slot matching is in SharedPowerArmorSystem.
  - type: ItemSlots
    slots:
      helmet:
        name: power-armor-slot-helmet
        whitelist:
          components:
          - PowerArmorPiece
      chest:
        name: power-armor-slot-chest
        whitelist:
          components:
          - PowerArmorPiece
      leftArm:
        name: power-armor-slot-left-arm
        whitelist:
          components:
          - PowerArmorPiece
      rightArm:
        name: power-armor-slot-right-arm
        whitelist:
          components:
          - PowerArmorPiece
      leftLeg:
        name: power-armor-slot-left-leg
        whitelist:
          components:
          - PowerArmorPiece
      rightLeg:
        name: power-armor-slot-right-leg
        whitelist:
          components:
          - PowerArmorPiece
  - type: Sprite
    # Above Mobs: the chassis then occludes the occupant's body on its own, so the head only
    # has to poke above the shoulders. No per-layer suppression needed.
    drawdepth: OverMobs
    scale: 1.25, 1.25
    noRot: true
    layers:
    # Chassis is backmost; armour bolts on over it. The piece RSI below is a placeholder: the
    # client swaps in the installed piece's own RSI, so any set can be fitted.
    - map: [ "enum.PowerArmorVisualLayers.Frame" ]
      sprite: _Nuclear14/Clothing/PowerArmorFrame/frame.rsi
      state: frame
    - map: [ "enum.PowerArmorVisualLayers.LeftLeg" ]
      sprite: _Nuclear14/Clothing/PowerArmorPiecesT51/pieces.rsi
      state: leftleg
      visible: false
    - map: [ "enum.PowerArmorVisualLayers.RightLeg" ]
      sprite: _Nuclear14/Clothing/PowerArmorPiecesT51/pieces.rsi
      state: rightleg
      visible: false
    - map: [ "enum.PowerArmorVisualLayers.LeftArm" ]
      sprite: _Nuclear14/Clothing/PowerArmorPiecesT51/pieces.rsi
      state: lefthand
      visible: false
    - map: [ "enum.PowerArmorVisualLayers.RightArm" ]
      sprite: _Nuclear14/Clothing/PowerArmorPiecesT51/pieces.rsi
      state: righthand
      visible: false
    - map: [ "enum.PowerArmorVisualLayers.Chest" ]
      sprite: _Nuclear14/Clothing/PowerArmorPiecesT51/pieces.rsi
      state: chest
      visible: false
    - map: [ "enum.PowerArmorVisualLayers.Helmet" ]
      sprite: _Nuclear14/Clothing/PowerArmorPiecesT51/pieces.rsi
      state: helmet
      visible: false
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 400
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 3
  - type: Clickable
  - type: DoAfter
  - type: NoSlip
  - type: Damageable
    damageContainer: Inorganic
  - type: Repairable
    fuelCost: 10
    doAfterDelay: 8
    qualityNeeded: Welding
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: FootstepModifier
    footstepSoundCollection:
      collection: N14FootstepPowerArmor
  - type: Tag
    tags:
    - FootstepSound
  - type: StaticPrice
    price: 1500

- type: entity
  parent: BasePowerArmorFrame
  id: PowerArmorFrame
  name: power armor frame
  description: A battered servo-assisted chassis. Climb in, then bolt the armour on. Any set fits.

# Power core

# Issued to the occupant for as long as they are inside. Inherits the worn suit's core, but the
# frame already governs movement, and this one carries a small grid instead of a speed penalty.
- type: entity
  parent: N14ClothingPowerSystemsBack
  id: PowerArmorFrameCore
  name: armor power core
  description: Bolted into the back of a power armor frame. Provides a little storage.
  components:
  - type: Storage
    maxItemSize: Normal
    defaultStorageOrientation: Vertical
    grid:
    - 0,0,5,2
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
# Stands in for the worn suit while inside. There is no Weapon component in this fork, so the
# rack whitelists the two that exist. Weapon storage only: no grid, so it is not a spare backpack.
- type: entity
  parent: ClothingOuterBase
  id: PowerArmorFrameArmor
  name: frame harness
  description: A spare outer layer issued by the frame. Holds a couple of weapons, nothing else.
  components:
  - type: Sprite
    sprite: _Nuclear14/Clothing/OuterClothing/PowerArmor/t51.rsi
  - type: Clothing
    sprite: _Nuclear14/Clothing/OuterClothing/PowerArmor/t51.rsi
  - type: Item
    size: Ginormous
  # The suitstorage slot is gated on the worn outer layer carrying this.
  - type: AllowSuitStorage
  - type: ItemSlots
    slots:
      weapon-primary:
        whitelist:
          components:
          - Gun
          - MeleeWeapon
      weapon-secondary:
        whitelist:
          components:
          - Gun
          - MeleeWeapon
