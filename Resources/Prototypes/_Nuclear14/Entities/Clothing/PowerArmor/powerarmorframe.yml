# Fallout 4 style power armour: a chassis you climb into with pieces bolted on as ordinary items.

# Armour pieces

- type: entity
  parent: BaseItem
  id: BasePowerArmorPiece
  abstract: true
  name: "power armor piece"
  components:
  - type: Item
    size: Small
  - type: PowerArmorPiece
  - type: StaticPrice
    price: 400

- type: entity
  parent: BasePowerArmorPiece
  id: PowerArmorPieceHelmetT45
  name: T-45 power armor helmet
  description: An armoured helmet with a sealed visor, designed to bolt onto a power armor frame.
  components:
  - type: Sprite
    sprite: _Nuclear14/Clothing/PowerArmorPieces/pieces.rsi
    layers:
    - state: helmet-icon
  - type: Item
    sprite: _Nuclear14/Clothing/PowerArmorPieces/pieces.rsi
    # All six pieces share one RSI, so the generic `inhand-left` lookup cannot be used.
    inhandVisuals:
      left:
      - state: helmet-inhand-left
      right:
      - state: helmet-inhand-right
  - type: PowerArmorPiece
    slot: Helmet
    wornStateName: helmet
    damageReduction: 0.9
  - type: StaticPrice
    price: 500

- type: entity
  parent: BasePowerArmorPiece
  id: PowerArmorPieceChestT45
  name: T-45 power armor chest piece
  description: The chestplate and shoulder assembly of a power armor frame. Heavy, and it shows.
  components:
  - type: Sprite
    sprite: _Nuclear14/Clothing/PowerArmorPieces/pieces.rsi
    layers:
    - state: chest-icon
  - type: Item
    sprite: _Nuclear14/Clothing/PowerArmorPieces/pieces.rsi
    inhandVisuals:
      left:
      - state: chest-inhand-left
      right:
      - state: chest-inhand-right
  - type: PowerArmorPiece
    slot: Chest
    wornStateName: chest
    damageReduction: 0.85

- type: entity
  parent: BasePowerArmorPiece
  id: PowerArmorPieceLeftArmT45
  name: T-45 power armor left arm
  description: A powered gauntlet that slots into the left shoulder of a power armor frame.
  components:
  - type: Sprite
    sprite: _Nuclear14/Clothing/PowerArmorPieces/pieces.rsi
    layers:
    - state: lefthand-icon
  - type: Item
    sprite: _Nuclear14/Clothing/PowerArmorPieces/pieces.rsi
    inhandVisuals:
      left:
      - state: lefthand-inhand-left
      right:
      - state: lefthand-inhand-right
  - type: PowerArmorPiece
    slot: LeftArm
    wornStateName: lefthand
    damageReduction: 0.9

- type: entity
  parent: BasePowerArmorPiece
  id: PowerArmorPieceRightArmT45
  name: T-45 power armor right arm
  description: A powered gauntlet that slots into the right shoulder of a power armor frame.
  components:
  - type: Sprite
    sprite: _Nuclear14/Clothing/PowerArmorPieces/pieces.rsi
    layers:
    - state: righthand-icon
  - type: Item
    sprite: _Nuclear14/Clothing/PowerArmorPieces/pieces.rsi
    inhandVisuals:
      left:
      - state: righthand-inhand-left
      right:
      - state: righthand-inhand-right
  - type: PowerArmorPiece
    slot: RightArm
    wornStateName: righthand
    damageReduction: 0.9

- type: entity
  parent: BasePowerArmorPiece
  id: PowerArmorPieceLeftLegT45
  name: T-45 power armor left leg
  description: A servo-assisted leg that slots into the left hip of a power armor frame.
  components:
  - type: Sprite
    sprite: _Nuclear14/Clothing/PowerArmorPieces/pieces.rsi
    layers:
    - state: leftleg-icon
  - type: Item
    sprite: _Nuclear14/Clothing/PowerArmorPieces/pieces.rsi
    inhandVisuals:
      left:
      - state: leftleg-inhand-left
      right:
      - state: leftleg-inhand-right
  - type: PowerArmorPiece
